<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B6EF5"/>
      <stop offset="55%" stop-color="#6F5CF0"/>
      <stop offset="100%" stop-color="#8A4FE8"/>
    </linearGradient>
    <linearGradient id="arrowTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- rounded square base -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#glow)"/>

  <!-- two orbiting sync arrows forming a loop, representing bidirectional device sync -->
  <g transform="translate(512,512)">
    <!-- top arc (left to right) -->
    <path d="M -196 -6
             A 196 196 0 0 1 120 -175"
          fill="none" stroke="url(#arrowTop)" stroke-width="56"
          stroke-linecap="round"/>
    <!-- arrow head for top arc, tangent to arc end -->
    <path d="M 68 -224 L 172 -210 L 148 -122 Z" fill="#FFFFFF"/>

    <!-- bottom arc (right to left) -->
    <path d="M 196 6
             A 196 196 0 0 1 -120 175"
          fill="none" stroke="#FFFFFF" stroke-width="56"
          stroke-linecap="round" stroke-opacity="0.92"/>
    <!-- arrow head for bottom arc, tangent to arc end -->
    <path d="M -68 224 L -172 210 L -148 122 Z" fill="#FFFFFF" fill-opacity="0.92"/>

    <!-- center dot: the "device" anchor -->
    <circle cx="0" cy="0" r="46" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#5B6EF5" stroke-width="6" stroke-opacity="0.25"/>
  </g>
</svg>
