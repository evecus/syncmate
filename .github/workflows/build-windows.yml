name: Build Windows

on:
  workflow_dispatch:

concurrency:
  group: build-windows
  cancel-in-progress: true

env:
  APP_NAME: syncmate
  APP_VERSION: "0.1.0"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/syncmate_windows
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # windows/ 尚未生成时由 flutter create 补齐；已有文件不会被覆盖
      # （pubspec、lib、test 保持仓库版本）。
      - name: 生成 Windows 平台工程
        run: |
          flutter create --platforms windows .
          flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 编译 Release
        run: flutter build windows --release

      - name: 安装 Inno Setup
        run: choco install innosetup --no-progress -y

      - name: 下载中文语言包
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
          $dest = "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing

      - name: 生成 Inno Setup 脚本
        shell: pwsh
        run: |
          $appName = $env:APP_NAME
          $appVersion = $env:APP_VERSION
          $releaseDir = "build\windows\x64\runner\Release"
          $exeName = "syncmate_windows.exe"

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $lines = @(
            '#define MyAppName "SyncMate"'
            "#define MyAppVersion `"$appVersion`""
            "#define MyAppExeName `"$exeName`""
            ''
            '[Setup]'
            'AppId={{B6C6E9C0-0E36-4C6D-9B2E-4E7B2E6B5C0A}}'
            'AppName={#MyAppName}'
            'AppVersion={#MyAppVersion}'
            'DefaultDirName={autopf}\{#MyAppName}'
            'DefaultGroupName={#MyAppName}'
            'DisableProgramGroupPage=yes'
            'OutputDir=dist'
            "OutputBaseFilename=${appName}_${appVersion}_setup"
            'Compression=lzma'
            'SolidCompression=yes'
            'ArchitecturesAllowed=x64compatible'
            'ArchitecturesInstallIn64BitMode=x64compatible'
            'UninstallDisplayIcon={app}\{#MyAppExeName}'
            ''
            '[Languages]'
            'Name: "chinesesimplified"; MessagesFile: "compiler:Languages\ChineseSimplified.isl"'
            'Name: "english"; MessagesFile: "compiler:Default.isl"'
            ''
            '[Tasks]'
            'Name: "desktopicon"; Description: "创建桌面快捷方式"; GroupDescription: "附加快捷方式:"'
            ''
            '[Files]'
            "Source: `"$releaseDir\*`"; DestDir: `"{app}`"; Flags: ignoreversion recursesubdirs createallsubdirs"
            ''
            '[Icons]'
            'Name: "{group}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"'
            'Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon'
            ''
            '[Run]'
            'Filename: "{app}\{#MyAppExeName}"; Description: "启动 {#MyAppName}"; Flags: nowait postinstall skipifsilent'
          )

          Set-Content -Path "installer.iss" -Value $lines -Encoding UTF8

      - name: 编译安装包
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: syncmate-windows-setup
          path: apps/syncmate_windows/dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: syncmate test
          prerelease: false
          make_latest: true
          files: apps/syncmate_windows/dist/*.exe
